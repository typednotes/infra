name: Live test

# Manual only, and one cloud at a time.
#
# This workflow CREATES AND DELETES a real resource — a queue named
# `ci-tests-infra-queue` — in whichever account the secrets point at. It is
# never triggered by a push, because a job that spends money should be started
# by a person who meant to.
#
# Each fleet in `test/Live.lean` is single-cloud, so a run for one provider
# authenticates only that provider: the AWS leg never reads Scaleway's secrets
# and vice versa. That falls out of `Keys.providers`, not from the `if`s below.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Which cloud to run against'
        required: true
        type: choice
        options: [aws, scaleway, gcp]
      leg:
        description: 'Which sequence: the ordinary fleet, or a Kubernetes cluster (aws only; ~45 min, billed by the hour)'
        required: false
        default: fleet
        type: choice
        options: [fleet, kubernetes]

# Never two live runs at once against the same account: the second would see
# the first's queue and the convergence check would be meaningless. Queued
# rather than cancelled, so a run always reaches its teardown.
#
# Note this does not impose a *gap* between runs, and AWS needs one: SQS
# refuses to recreate a queue deleted less than sixty seconds ago. Two AWS runs
# in quick succession will fail on create, with an error that says exactly
# that.
concurrency:
  group: live-test-${{ inputs.provider }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token AWS trades for a role

jobs:
  live:
    runs-on: ubuntu-24.04
    env:
      # Empty for the ordinary sequence; `kubernetes` selects the cluster leg
      # (`lake test -- <provider> kubernetes`, `test/Live.lean`).
      LEG_ARG: ${{ inputs.leg == 'kubernetes' && 'kubernetes' || '' }}
    # The environment is load-bearing, not decorative. The AWS role's trust
    # policy pins `sub` to `repo:typednotes/infra:environment:production`, so
    # the OIDC token only carries that claim when the job declares this — and
    # `sts:AssumeRoleWithWebIdentity` is refused otherwise. Removing this line
    # does not loosen the gate; it breaks AWS auth entirely, which is the
    # failure mode to want.
    #
    # It is also where required reviewers live. Add them in
    # Settings -> Environments -> production, and assuming a role with
    # PowerUserAccess then needs a human to approve the run. That approval is
    # the compensating control for the breadth of the policy, and it is the one
    # thing this file cannot enforce for itself.
    environment: production
    env:
      # The value the test secret is created with. Not a secret in any real
      # sense — it exists for about a minute in a resource named
      # `ci-tests-infra-*` and is then deleted — but it is written here rather
      # than in the fleet because the fleet is committed and
      # `secretsAreSound` refuses a literal at compile time. That guard is the
      # feature, so the test respects it rather than working around it.
      CI_TESTS_INFRA_SECRET: not-a-real-secret-created-and-destroyed-by-ci
    # A hung provider call must not hold a runner, and must not skip teardown:
    # the step timeout below is shorter, so the job's own cleanup still runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false

      # AWS via OIDC: no long-lived key. GitHub mints a short-lived token, AWS
      # trades it for role credentials that expire with the job. `id-token:
      # write` above is what allows the mint, and the role's trust policy is
      # what restricts it to this repository.
      - name: Check the AWS role ARN is configured
        if: inputs.provider == 'aws'
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        run: |
          # Without this, an unset ARN makes `configure-aws-credentials` omit
          # `role-to-assume`, fall back to looking for static keys, and report
          # "Could not load credentials from any providers", which names
          # neither the variable nor the fact that OIDC never happened.
          #
          # The value is also trimmed. A settings field is a text box and a
          # leading space is invisible in it; this one arrived with one.
          ROLE="$(echo "$ROLE" | xargs)"
          echo "AWS_ROLE_ARN_CLEAN=$ROLE" >> "$GITHUB_ENV"
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_ROLE_ARN is not set. Add it under Settings -> Secrets and variables -> Actions, as a variable or a secret; both are read. Expected something like arn:aws:iam::616568506952:role/infra-ci"
            exit 1
          fi
          echo "role: $ROLE"

      # What AWS is actually matching against. `Not authorized to perform
      # sts:AssumeRoleWithWebIdentity` means the provider validated the token
      # and the role's trust policy then refused it — so the only useful
      # question is what the claims say, and nothing else prints them.
      #
      # Claims are identifiers, not secrets: `sub` names the repository and
      # environment, `aud` the intended audience. The token itself is never
      # printed.
      - name: Show the OIDC claims the trust policy must match
        if: inputs.provider == 'aws'
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::could not obtain an OIDC token — is 'permissions: id-token: write' set?"
            exit 1
          fi
          # Second segment of the JWT, base64url-decoded. Padding added because
          # base64url omits it and `base64 -d` insists.
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          PAYLOAD="$PAYLOAD$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, environment, job_workflow_ref}'
          echo
          echo "The role's trust policy must accept the 'sub' and 'aud' above."
          echo "Compare with: aws iam get-role --role-name infra-ci \\"
          echo "  --query 'Role.AssumeRolePolicyDocument.Statement[0].Condition'"

      # The Kubernetes leg runs on AWS only from here. Scaleway's and GCP's CI
      # identities hold the scan's *read* grants for clusters and nothing that
      # creates one; their legs were run by hand (2026-09-29, docs/coverage.md).
      # Refused up front, rather than failing twenty minutes in on a 403.
      - name: Kubernetes leg — supported provider
        if: inputs.leg == 'kubernetes' && inputs.provider != 'aws'
        run: |
          echo "::error::the Kubernetes leg runs from this workflow on aws only; the ${{ inputs.provider }} CI identity cannot create clusters. Run \`lake test -- ${{ inputs.provider }} kubernetes\` by hand (ci/README.md, \"The Kubernetes leg\")."
          exit 1

      - name: Authenticate to AWS (OIDC)
        if: inputs.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN_CLEAN }}
          aws-region: eu-west-1
          role-session-name: infra-live-test
          # An EKS create, four stages and a delete outlast the default hour,
          # and credentials that expire mid-teardown strand a billed cluster.
          # Two hours needs the role's MaxSessionDuration raised to match
          # (ci/README.md, "The Kubernetes leg"); until it is, this step
          # fails, before anything is created.
          role-duration-seconds: ${{ inputs.leg == 'kubernetes' && 7200 || 3600 }}

      # GCP via Workload Identity Federation: no key material anywhere. GitHub
      # mints an OIDC token, GCP's STS trades it for a short-lived one for the
      # `infra-ci` service account. The provider's attribute-condition limits
      # this to the `typednotes` org, and the service account's own IAM policy
      # narrows it further to this one repository.
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        if: inputs.provider == 'gcp'
        uses: google-github-actions/auth@v3
        with:
          project_id: typednotes
          workload_identity_provider: projects/113928363564/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: infra-ci@typednotes.iam.gserviceaccount.com
          token_format: access_token

      # `infra` reads the token from the environment, so hand it across under
      # the name the credential chain looks for.
      - name: Export the GCP token for infra
        if: inputs.provider == 'gcp'
        run: |
          echo "GOOGLE_OAUTH_ACCESS_TOKEN=${{ steps.gcp-auth.outputs.access_token }}" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=typednotes" >> "$GITHUB_ENV"

      - name: Build
        run: lake build live-test

      # The offline leg always runs, whichever provider was chosen. It costs
      # nothing and it fails fast on anything that would also break the live
      # run — a bad fleet, a bad plan, a bad build.
      - name: Offline checks
        run: lake test

      - name: Check the secrets for this provider are present
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          CI_TESTS_INFRA_SECRET: ${{ env.CI_TESTS_INFRA_SECRET }}
        run: |
          # An unset GitHub secret arrives as the empty string, not as absent —
          # which is exactly the case `Credentials.normalizeEnv` exists for.
          # Checking here means the failure names the missing secret instead of
          # surfacing later as an opaque 403.
          case "${{ inputs.provider }}" in
            aws)      need="" ;;   # OIDC — checked by the role-ARN step above
            # The organization id too: every run lists IAM applications, which
            # are organization-scoped (ci/README.md, "Read-only grants for the
            # scan"). Inherited from the organization's secrets, not the repo's.
            scaleway) need="SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID SCW_DEFAULT_ORGANIZATION_ID" ;;
            gcp)      need="" ;;   # WIF — no static secret exists
          esac
          # Every provider needs this one: the fleet now declares a secret, and
          # its value is read from the environment rather than committed.
          need="$need CI_TESTS_INFRA_SECRET"
          missing=""
          for v in $need; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            exit 1
          fi

      # Creates one queue, checks the fleet converged, deletes it again.
      # Teardown is inside the driver (`test/Live.lean`) rather than in a
      # separate `if: always()` step, deliberately: it needs the same fleet,
      # cache and backends the create used, and a shell step would have to
      # reconstruct all three.
      # Sized from the driver, not guessed: two polls of `settleSeconds`
      # (180s each) plus creation and deletion of what stage 1 declares —
      # twelve resources on AWS and Scaleway, ten on GCP, pinned by `#guard`
      # in `test/Live.lean` — some of which (Scaleway's Functions and
      # Containers namespaces, and a container pulling an image) take tens of
      # seconds each way. That is about nine minutes at worst, and a step
      # timeout must exceed the worst case or a slow-but-working run is
      # reported as a failure.
      # The Kubernetes leg: EKS takes ten to twenty minutes each way, plus a
      # node group, plus four stages — sixty minutes is the ceiling, not the
      # expectation.
      - name: Live round trip — ${{ inputs.provider }} ${{ inputs.leg }}
        timeout-minutes: ${{ inputs.leg == 'kubernetes' && 60 || 16 }}
        env:
          # Scaleway only. AWS arrives from the OIDC step as real environment
          # variables, and GCP's token likewise — neither is passed here, and
          # neither cloud's secrets reach a run for the other.
          SCW_ACCESS_KEY: ${{ inputs.provider == 'scaleway' && secrets.SCW_ACCESS_KEY || '' }}
          SCW_SECRET_KEY: ${{ inputs.provider == 'scaleway' && secrets.SCW_SECRET_KEY || '' }}
          SCW_DEFAULT_PROJECT_ID: ${{ inputs.provider == 'scaleway' && secrets.SCW_DEFAULT_PROJECT_ID || '' }}
          # Needed although `resource iam` is out of the Scaleway fleet: every
          # run lists every kind, IAM applications included, to find resources
          # carrying this fleet's marker (`Engine.claimUndeclared`), and those
          # are organization-scoped. CI can read them, not change them — see
          # ci/README.md, "Read-only grants for the scan".
          SCW_DEFAULT_ORGANIZATION_ID: ${{ inputs.provider == 'scaleway' && secrets.SCW_DEFAULT_ORGANIZATION_ID || '' }}
        run: lake test -- ${{ inputs.provider }} $LEG_ARG

      # If the driver died between create and delete — a killed runner, a
      # cancelled job, a failed assertion — this is the backstop.
      #
      # It calls the driver's `destroy` mode, which tears down and nothing
      # else. It used to re-run `lake test -- <provider>`, on the reasoning
      # that destroy is idempotent — but that command is a create *and* a
      # destroy, so a failed run was followed by a second create that failed
      # the same way, and could leave more behind than it cleaned up. The first
      # extended AWS run did exactly that: the same security-group error twice,
      # once from the test and once from its own backstop.
      # `destroy` and `sweep` are the same for both legs: the Kubernetes fleets
      # carry the same marker and the same `ci-tests-infra-` prefix, and both
      # modes scan every kind. An EKS delete (node group, then cluster) takes
      # up to twenty minutes.
      - name: Backstop teardown
        if: failure() || cancelled()
        timeout-minutes: ${{ inputs.leg == 'kubernetes' && 30 || 6 }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          # `destroy` scans every kind, IAM applications included, and those
          # are organization-scoped: without this, the Scaleway teardown fails
          # with "no Scaleway organization configured" before deleting anything.
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          echo "::warning::live run did not finish cleanly; tearing down"
          lake test -- ${{ inputs.provider }} destroy || true
          # A sweep as well. `destroy` removes what carries this fleet's
          # marker, and a run that died mid-create may have left something
          # before its marker was written; the sweep deletes by the
          # 'ci-tests-infra-' name prefix instead, marker or not.
          lake test -- ${{ inputs.provider }} sweep || true
          echo "If this still fails, run the Cleanup workflow, or look for resources named 'ci-tests-infra-*'"
