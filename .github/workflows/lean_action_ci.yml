name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Report both legs. The platform-specific link flags in `lakefile.lean`
      # differ enough between them that a cancelled leg hides real information:
      # the first CI failure here was Linux-only and cancelled macOS with it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      # Linen's FFI is a single `extern_lib`, so building it compiles *every*
      # `.c` under its `ffi/` — libpq, OpenSSL, libsecret, SQLite, DuckDB —
      # whether or not this package imports the corresponding module. `infra`
      # therefore needs Linen's whole native dependency set to build at all,
      # not merely the parts it uses (`System.Keychain` for credentials,
      # `Crypto.SigV4` and TLS for the providers).
      #
      # These mirror linen's own CI, and keeping them in step matters: this job
      # started failing the moment `Infra.Core.Credentials` pulled in
      # `System.Keychain`, with `keychain.c` unable to find
      # `libsecret/secret.h`.
      #
      # OpenSSL is needed for its *headers* only. Lean's toolchain bundles
      # static `libssl.a`/`libcrypto.a` and links them into every executable
      # itself, so `lakefile.lean` deliberately passes no OpenSSL link flags —
      # see the comment there on why naming the system `.so` breaks the link.
      - name: Install native FFI dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libssl-dev libsecret-1-dev pkg-config
      - name: Install native FFI dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq openssl pkg-config
          # libpq/openssl are keg-only on Homebrew, so pkg-config needs an
          # explicit PKG_CONFIG_PATH to find their .pc files — which is also
          # how `lakefile.lean` resolves OpenSSL's link flags.
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix openssl)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: leanprover/lean-action@v1
      # `lake build` compiles the library and runs every `#guard`. This step
      # additionally runs the offline self-checks: SigV4 against AWS's
      # published vectors, the credential chain and its redaction, divergence,
      # and push's dry-run ordering. No cloud credentials are needed, and none
      # are available here.
      - name: Run offline self-checks
        run: lake exe infra check
      # The test driver, offline: it builds every live fleet and plans it
      # against the placeholder backends. That is what catches a live test
      # broken by an unrelated change *before* someone runs it against a real
      # account. Passing a provider is the live path and is never done here —
      # see `.github/workflows/live-test.yml`, which is manual only.
      - name: Run the test driver (offline)
        run: lake test
      # The native link-flag block exists in two places — this repo's lakefile
      # and the copy `infra new` writes into a scaffolded project — because
      # Lake cannot propagate `moreLinkArgs` from a dependency. They drifted
      # once, and the drift broke the link on Linux in every scaffolded
      # project while this repo itself kept building. Cheap to check, so it is
      # checked.
      # An IAM policy document cannot carry a comment, and one shipped with a
      # top-level "Comment" key. `create-policy` rejected it, and the failure
      # showed up one command later as `NoSuchEntity … is not attachable` from
      # the attach step — naming neither the cause nor the file. Grammar is
      # cheap to check offline, so it is checked.
      - name: Check the AWS CI policy document is well-formed
        run: ./ci/check-aws-policy.py
      - name: Check the scaffolder's lakefile copy has not drifted
        run: ./ci/check-lakefile-sync.sh
      # `pages.yml` publishes `site/` alone, so the page carries its own copy
      # of the artwork and there are two copies of every file. They drifted
      # the day they were introduced — a `<picture>` source was added pointing
      # at a file that existed only on the source side, and a matching
      # `<source>` that 404s does not fall back to its `<img>`, so dark mode
      # would have shown broken images on the published site with every local
      # check passing.
      - name: Check the published site's assets are in sync and resolve
        run: ./ci/check-site-assets-sync.sh
      # Scaffolding is only really tested by building the thing it produces —
      # which is the one check AGENTS.md names for it, and the one that would
      # have caught the drift above. The generated lakefile points at `main`,
      # so it is repointed at this checkout to test *these* flags.
      - name: Scaffold a project and build it
        run: |
          set -e
          rm -rf /tmp/scaffold-check
          lake exe infra new /tmp/scaffold-check
          # Repoint the dependency at this checkout, so the flags under test are
          # these ones and not `main`'s.
          #
          # Not `sed -i`: BSD sed reads the next argument as a backup suffix
          # and GNU sed does not, so the one-liner that worked on the Linux
          # runner failed on the macOS one — which is exactly the half of the
          # matrix this step was added to protect. Python is on both runners
          # and needs no such dialect.
          python3 - "$PWD" <<'PY'
          import re, sys
          p = "/tmp/scaffold-check/lakefile.lean"
          s = open(p).read()
          s2 = re.sub(r'require infra from git "[^"]*" @ "main"',
                      'require infra from "%s"' % sys.argv[1], s, count=1)
          assert s2 != s, "the scaffolded lakefile did not carry the expected require line"
          open(p, "w").write(s2)
          PY
          cp lean-toolchain /tmp/scaffold-check/
          cd /tmp/scaffold-check
          # Reuse this checkout's package directory rather than resolving a
          # fresh one. Two reasons, and the second is the important one.
          #
          # Cost: without it the scaffolded project builds the whole of `linen`
          # a second time — the job above has already built it once — which
          # locally was killed by the OOM killer (`Lean exited with code 137`)
          # part-way through `Linen.PostgREST.App`.
          #
          # Reproducibility: `lake update` would resolve `linen` at `main`,
          # because that is what this repo's own lakefile asks for. A consumer
          # would then get whatever linen happens to be at HEAD rather than the
          # revision infra was tested against, so this check could fail — or
          # pass — for reasons that have nothing to do with the commit under
          # test. Pointing at the packages this checkout already resolved uses
          # the pinned revision from its manifest.
          export LAKE_PACKAGES_DIR="$GITHUB_WORKSPACE/.lake/packages"
          lake build
          ./.lake/build/bin/scaffold_check
      # Every example is test surface, per AGENTS.md. All but `scaleway-pull`
      # are offline and free, so CI runs them; a bare invocation plans against
      # the placeholder backends.
      - name: Run the examples (offline)
        run: |
          for e in scaleway-queue paris-instances cross-cloud multi-region; do
            echo "── $e ──"
            lake exe "$e" > /dev/null
          done
