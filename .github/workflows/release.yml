name: Release

# Version tags publish only after the exact commit's full main CI succeeds.
# No build/test/example matrix is repeated on tags, and no live cloud job runs.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (e.g. v0.24.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      tag: ${{ steps.ci.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for successful main CI for the exact tag commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: bash ci/require-main-ci.sh lean_action_ci.yml "$TAG"

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      # The tag is the source of truth for which version this release is —
      # not any file in the tree — so every check below is phrased in terms
      # of it.
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          tag="$TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # AGENTS.md: "a release bumps the version everywhere it is written
      # down". The script is the list — nine places as of 0.11.0 — rather
      # than this comment, which is what let the last two drift: the page's
      # "what's new" banner and README's "What X covers" heading were not in
      # the script, so v0.10.0 and v0.10.1 both passed this gate while the
      # page still advertised 0.9.0.
      #
      # A tag pushed without updating all of them is exactly the failure this
      # blocks: it must not turn into a GitHub Release that scaffolds
      # projects against the wrong `infraRev` or ships a page claiming a
      # feature the tagged commit doesn't have — or, as it did, a page
      # announcing a release two behind.
      - name: Check the tagged version is consistent everywhere
        run: ./ci/check-release-version.sh "${{ steps.version.outputs.version }}"

      # The release body is that version's own CHANGELOG section — not
      # hand-written here — so the two can never say different things about
      # the same release.
      - name: Extract this version's CHANGELOG section
        id: notes
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "error: no CHANGELOG.md section found for [${{ steps.version.outputs.version }}]" >&2
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" \
              --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --title "$TAG" --verify-tag \
              --notes-file /tmp/release-notes.md "${FLAGS[@]}"
          fi
