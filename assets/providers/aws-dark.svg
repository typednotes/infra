<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 60" width="150" height="60"
     role="img" aria-label="AWS">
  <title>AWS</title>
  <!-- Theme variant. The pair (name.svg, name-dark.svg) is the drop-in socket
       for a vendor's OWN two files: replace both and change only the width and
       height in site/index.html. Do not recolour a vendor's single file to make
       the second one — see docs/branding.md, that is usually the exact thing
       their guidelines forbid. -->
  <!-- A monochrome wordmark in currentColor: the provider's NAME, set in this
       project's own type. Deliberately not a reproduction of their logo —
       see docs/branding.md for why the same caution applies here as to Lean
       and OpenTofu. Nominative use of a name is a different thing from
       reproducing a mark. -->
  <text x="0" y="44" fill="#f2f4f8"
        font-family="'DM Sans','Inter','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1.4">AWS</text>
</svg>
