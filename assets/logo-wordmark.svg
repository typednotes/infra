<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 126" width="430" height="126"
     role="img" aria-label="infra">
  <title>infra</title>
  <g>
    <path d="M60 18 L102 42 L60 66 L18 42 Z" fill="#7C93B4"/>
    <path d="M18 42 L60 66 L60 108 L18 84 Z" fill="#3F5372"/>
    <path d="M102 42 L60 66 L60 108 L102 84 Z" fill="#386EE0"/>
    <g transform="matrix(42 -24 0 42 60 66)" fill="#FFFFFF">
      <rect x="0.60" y="0.20" width="0.115" height="0.60"/>
      <rect x="0.28" y="0.20" width="0.435" height="0.115"/>
      <rect x="0.28" y="0.4425" width="0.435" height="0.115"/>
      <rect x="0.28" y="0.685" width="0.435" height="0.115"/>
    </g>
  </g>
  <!-- Set in a system stack rather than converted to outlines: this is a
       project wordmark, not a registered mark, and a missing font degrades to
       a readable word rather than to nothing.

       The cube's three fills read on either background; only the wordmark
       needs to flip, so only it is themed. -->
  <style>
    .wordmark { fill: #1F2937; }
    @media (prefers-color-scheme: dark) { .wordmark { fill: #E8EDF5; } }
  </style>
  <text class="wordmark" x="140" y="90"
        font-family="'DM Sans','Inter','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="76" font-weight="700" letter-spacing="-2">infra</text>
</svg>
