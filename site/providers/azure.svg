<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 60" width="190" height="60"
     role="img" aria-label="Azure">
  <title>Azure</title>
  <!-- A monochrome wordmark in currentColor: the provider's NAME, set in this
       project's own type. Deliberately not a reproduction of their logo —
       see docs/branding.md for why the same caution applies here as to Lean
       and OpenTofu. Nominative use of a name is a different thing from
       reproducing a mark. -->
  <text x="0" y="44" fill="currentColor"
        font-family="'DM Sans','Inter','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1.4">Azure</text>
</svg>
